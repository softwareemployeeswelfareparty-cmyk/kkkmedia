# Netlify Edge Reverse Proxy Configuration for KKK Media
# Connects Netlify Frontend (https://kkkmedia.netlify.app) to Render Backend

[[redirects]]
  from = "/*"
  to = "https://kkkmedia-5.onrender.com/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
