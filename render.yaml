# Render Blueprint: Free Node.js Web Service for KKK Media connected to Supabase
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: kkkmedia
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && node scripts/sync-db.js && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: kkkmedia
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: SITE_NAME
        value: KKK Media
      - key: SITE_TAGLINE
        value: தமிழின் முன்னணி டிஜிட்டல் செய்தி தளம்
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@kkkmedia.com
      - key: ADMIN_DEFAULT_PASSWORD
        value: Admin@KKKMedia2026!
