# Render Blueprint: 1-Click Free Deployment for KKK Media
# Documentation: https://render.com/docs/blueprint-spec

databases:
  - name: kkkmedia-db
    databaseName: kkkmedia
    user: kkkmedia_admin
    plan: free
    region: oregon

services:
  - type: web
    name: kkkmedia
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && node scripts/sync-db.js && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kkkmedia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: SITE_NAME
        value: KKK Media
      - key: SITE_TAGLINE
        value: தமிழின் முன்னணி டிஜிட்டல் செய்தி தளம்
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@kkkmedia.com
      - key: ADMIN_DEFAULT_PASSWORD
        value: Admin@KKKMedia2026!
